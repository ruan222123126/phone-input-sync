[package]
name = "phone-input-sync-desktop"
version = "0.1.0"
edition = "2021"
description = "LAN server: receive text from phone and paste into focused PC input"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs", "cors"] }
arboard = "3"
enigo = "0.2"
local-ip-address = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
